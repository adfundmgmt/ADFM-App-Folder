name: Refresh SEC 13F releases

on:
  workflow_dispatch:
  schedule:
    # SEC bulk 13F packages are produced after the Feb/May/Aug/Nov windows.
    # Check every other day during the first half of Mar/Jun/Sep/Dec.
    - cron: "17 12 1-15/2 3,6,9,12 *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install refresher dependencies
        run: python -m pip install requests beautifulsoup4 pandas pyarrow

      - name: Refresh official SEC release list
        run: python scripts/update_13f_release_fallbacks.py

      - name: Commit a newly published SEC release
        shell: bash
        run: |
          if git diff --quiet -- adfm_core/sec_13f_browser.py data/13f/releases.json; then
            echo "No new SEC 13F bulk release published yet."
            exit 0
          fi
          git config user.name "ADFM Release Bot"
          git config user.email "adfundmgmt@users.noreply.github.com"
          git add adfm_core/sec_13f_browser.py data/13f/releases.json
          git commit -m "Refresh SEC 13F bulk releases"
          git push

name: Refresh SEC 13F releases

on:
  workflow_dispatch:
  schedule:
    # SEC bulk 13F packages are produced after the Feb/May/Aug/Nov windows.
    # Check every other day during the first half of Mar/Jun/Sep/Dec.
    - cron: "17 12 1-15/2 3,6,9,12 *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install refresher dependencies
        # adfm_core imports the shared Streamlit/market-data package at startup.
        run: python -m pip install -r requirements.txt

      - name: Refresh official SEC release list
        run: python -m scripts.update_13f_release_fallbacks

      - name: Commit a newly published SEC release
        shell: bash
        run: |
          if git diff --quiet -- adfm_core/sec_13f_browser.py data/13f/releases.json; then
            echo "No new SEC 13F bulk release published yet."
            exit 0
          fi
          git config user.name "ADFM Release Bot"
          git config user.email "adfundmgmt@users.noreply.github.com"
          git add adfm_core/sec_13f_browser.py
          # Only this curated manifest belongs in Git; bulk 13F caches stay ignored.
          git add -f -- data/13f/releases.json
          git commit -m "Refresh SEC 13F bulk releases"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to publish SEC releases after 3 attempts."
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done

name: Ruff Import Probe

on:
  push:
    branches:
      - feature/web-platform-roc

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.21
      - name: Show Ruff import fix
        run: ruff check --select I --fix --diff tests/test_public_equities_basket_map.py || true

name: Application checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Compile, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile application sources
        run: python -m compileall -q Home.py pages adfm_core cte scripts adfm_sector_rotation_config.py tests

      - name: Run CFTC positioning tests
        run: python -m unittest tests.test_cftc_positioning -v

      - name: Run catalog and page standards tests
        run: python -m unittest tests.test_documentation tests.test_repository_standards tests.test_ui_theme tests.test_sec_13f_page -v

      - name: Run Home and page integration tests
        run: python -m unittest tests.test_home_command_center tests.test_relative_volatility_page -v

      - name: Run SEC 13F core tests
        run: python -m unittest tests.test_sec_13f -v

      - name: Run remaining tests A
        run: python -m unittest tests.test_adfm_core_catalog tests.test_adfm_core_data_integrity tests.test_adfm_core_market_data tests.test_chart_patterns tests.test_correlation_regime tests.test_cte_math tests.test_data_registry tests.test_monthly_returns_matrix -v

      - name: Run remaining tests B
        run: python -m unittest tests.test_options_positioning tests.test_options_sources tests.test_palette tests.test_pm_cockpit tests.test_position_sizing tests.test_primary_data tests.test_rate_of_change tests.test_regime_math tests.test_relative_volatility -v

      - name: Run remaining tests C
        run: python -m unittest tests.test_sec_fundamentals tests.test_signal_ledger tests.test_snapshot_validation -v

      - name: Run full test suite with coverage
        run: coverage run --source=adfm_core,cte -m unittest discover -s tests -p "test_*.py" -v

      - name: Enforce coverage floor
        run: coverage report --show-missing --fail-under=45

      - name: Lint shared code, engine, scripts, and tests
        run: ruff check --select E,F,I,B --ignore E501 Home.py adfm_core cte scripts tests

      - name: Catch fatal page errors
        run: ruff check --select E9,F63,F7,F82 pages adfm_sector_rotation_config.py

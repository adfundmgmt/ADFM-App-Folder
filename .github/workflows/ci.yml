name: Application checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Compile, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile application sources
        run: python -m compileall -q Home.py pages adfm_core cte scripts adfm_momentum_scanner.py adfm_sector_rotation_config.py tests

      - name: Run tests with coverage
        run: |
          coverage run --source=adfm_core,cte -m unittest discover -s tests -p "test_*.py" -v
          coverage report --show-missing --fail-under=45

      - name: Lint shared code, engine, scripts, and tests
        run: ruff check --select E,F,I,B --ignore E501 Home.py adfm_core cte scripts tests

      - name: Catch fatal page errors
        run: ruff check --select E9,F63,F7,F82 pages adfm_momentum_scanner.py adfm_sector_rotation_config.py

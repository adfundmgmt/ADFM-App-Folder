name: Local Runtime Bundle

on:
  push:
    branches:
      - feature/web-platform-roc
    paths:
      - ".github/workflows/local-runtime-bundle.yml"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build standalone web app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_ADFM_API_URL: http://127.0.0.1:8000
        run: |
          npm install
          cat > next.config.mjs <<'EOF'
          const nextConfig = { output: "standalone" };
          export default nextConfig;
          EOF
          npm run build

      - name: Package standalone web runtime
        run: |
          mkdir -p runtime-web
          cp -R apps/web/.next/standalone/. runtime-web/
          mkdir -p runtime-web/.next
          cp -R apps/web/.next/static runtime-web/.next/static
          if [ -d apps/web/public ]; then cp -R apps/web/public runtime-web/public; fi
          tar -czf adfm-web-standalone.tgz -C runtime-web .

      - name: Upload standalone web runtime
        uses: actions/upload-artifact@v4
        with:
          name: adfm-web-standalone
          path: adfm-web-standalone.tgz
          retention-days: 1

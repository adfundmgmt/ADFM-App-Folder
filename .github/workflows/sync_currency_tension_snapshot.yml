name: Rebuild currency tension snapshot

on:
  schedule:
    - cron: "30 12 * * 1-5"
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-currency-tension-snapshot
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cte.txt
            constraints.txt

      - name: Install Currency Tension dependencies
        run: python -m pip install -r requirements-cte.txt

      - name: Verify required provider credential
        shell: bash
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${FRED_API_KEY:-}" || { echo "FRED_API_KEY is not configured."; exit 1; }

      - name: Refresh primary source caches
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m scripts.backfill --daily

      - name: Seed map history when needed
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m scripts.backfill_history --if-missing

      - name: Rebuild Currency Tension scores
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m cte.scoring.engine

      - name: Refresh optional Daily Read
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            python -m cte.commentary.narrator
          else
            echo "ANTHROPIC_API_KEY is not configured; removing stale cached commentary."
            rm -f data/cache/commentary.md data/cache/commentary_meta.json
          fi

      - name: Validate rebuilt snapshot
        run: python scripts/validate_currency_snapshot.py data/cache

      - name: Commit validated snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ADFM Currency Data Bot"
          git config user.email "adfundmgmt@users.noreply.github.com"

          git add -f -- \
            data/cache/carry_grid_nominal.parquet \
            data/cache/carry_grid_real.parquet \
            data/cache/carry_history.parquet \
            data/cache/overlay_history.parquet \
            data/cache/overlays.parquet \
            data/cache/pillar_history.parquet \
            data/cache/pillar_scores.parquet \
            data/cache/pos_history.parquet \
            data/cache/snapshot_history.parquet \
            data/cache/tension_map.parquet \
            data/cache/tension_map_prev.parquet \
            data/cache/warnings.json \
            data/cache/yields.parquet \
            data/cache/snapshot_manifest.json

          if [ -f data/cache/commentary.md ]; then
            git add -f -- data/cache/commentary.md data/cache/commentary_meta.json
          else
            git add -u -- data/cache/commentary.md data/cache/commentary_meta.json || true
          fi

          if git diff --cached --quiet; then
            echo "Currency tension snapshot is already current."
            exit 0
          fi

          git commit -m "chore: rebuild validated currency tension snapshot"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push snapshot after 3 attempts."
              exit 1
            fi

            echo "Push raced with another main-branch update; rebasing and retrying ($attempt/3)."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done

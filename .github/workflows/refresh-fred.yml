name: Refresh validated FRED snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "23 13,17,22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: adfm-fred-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download and validate source observations
        id: refresh
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m scripts.refresh_fred_snapshot
      - name: Publish validated updates
        shell: bash
        run: |
          git add -- data/fred
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "ADFM Data Bot"
          git config user.email "adfundmgmt@users.noreply.github.com"
          git commit -m "Refresh validated FRED macro snapshots"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
      - name: Report partial provider failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "Some FRED refreshes failed validation. Last-good files were retained; inspect data/fred/refresh_status.json."
          exit 1

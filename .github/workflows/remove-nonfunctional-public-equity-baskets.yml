name: Remove nonfunctional public equity baskets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-nonfunctional-public-equity-baskets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove nonfunctional basket definitions
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              "Taiwan AI ODM and Thermal",
              "Korea Shipbuilding and Defense",
              "Korea Power Equipment",
              "India Defense and Capital Goods",
              "India Power and Grid Equipment",
          ]

          page = Path("pages/1_ADFM_Public_Equities_Baskets.py")
          text = page.read_text(encoding="utf-8")

          def remove_dict_list_entry(source: str, name: str) -> str:
              needle = f"'{name}': ["
              pos = source.find(needle)
              if pos < 0:
                  raise SystemExit(f"Basket definition not found: {name}")
              line_start = source.rfind("\n", 0, pos) + 1
              open_bracket = source.find("[", pos)
              depth = 0
              close_bracket = None
              for i in range(open_bracket, len(source)):
                  if source[i] == "[":
                      depth += 1
                  elif source[i] == "]":
                      depth -= 1
                      if depth == 0:
                          close_bracket = i
                          break
              if close_bracket is None:
                  raise SystemExit(f"Unclosed ticker list for {name}")

              end = close_bracket + 1
              if end < len(source) and source[end] == ",":
                  end += 1
              if end < len(source) and source[end] == "\n":
                  end += 1
                  replacement = ""
              elif end < len(source) and source[end] == "}":
                  replacement = source[line_start:pos]
              else:
                  replacement = ""
              return source[:line_start] + replacement + source[end:]

          for name in targets:
              text = remove_dict_list_entry(text, name)
          page.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_public_equities_basket_map.py")
          if test_path.exists():
              lines = test_path.read_text(encoding="utf-8").splitlines()
              lines = [line for line in lines if not any(name in line for name in targets)]
              test_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          git config user.name "adfundmgmt"
          git config user.email "aryadeniz@adfundmgmt.com"
          git add pages/1_ADFM_Public_Equities_Baskets.py tests/test_public_equities_basket_map.py
          if git diff --cached --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git commit -m "Remove nonfunctional public equity baskets"
          git push

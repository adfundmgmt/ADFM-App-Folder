name: Remove private robotics basket

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove_private_robotics_basket.yml"
      - ".github/scripts/remove_private_robotics_basket.py"

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Remove and validate basket
        run: |
          python .github/scripts/remove_private_robotics_basket.py
          python -m py_compile pages/1_ADFM_Public_Equities_Baskets.py
          git diff --check

      - name: Commit basket removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/1_ADFM_Public_Equities_Baskets.py
          git commit -m "Remove private robotics access basket"
          git push

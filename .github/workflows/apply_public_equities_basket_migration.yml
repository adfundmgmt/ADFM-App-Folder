name: Apply public equities basket migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply_public_equities_basket_migration.yml"
      - ".github/scripts/update_public_equities_baskets.py"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply and validate basket migration
        run: |
          python .github/scripts/update_public_equities_baskets.py
          python -m py_compile pages/1_ADFM_Public_Equities_Baskets.py
          git diff --check

      - name: Commit basket definitions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/1_ADFM_Public_Equities_Baskets.py
          if git diff --cached --quiet; then
            echo "Migration produced no changes."
            exit 1
          fi
          git commit -m "Consolidate and expand public equities baskets"
          git push
